<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 58" width="132" height="58" role="img" aria-label="Kopi Kita Kita">
  <title>Kopi Kita Kita — placeholder logo (ganti file ini)</title>
  <!--
    PLACEHOLDER LOGO — berbasis teks & garis, memakai currentColor supaya
    otomatis menyesuaikan dengan warna latar (navbar gelap / footer gelap).

    CARA MENGGANTI:
    1. Taruh file logo baru (SVG/PNG/WebP) di /public/images/logo/
    2. Ubah nilai "logo" di src/content/settings/site.json
       (atau pilih lewat dashboard CMS -> Pengaturan Situs)
  -->
  <g
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"

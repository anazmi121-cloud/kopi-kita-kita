    <path d="M13 14c0-4 4-4 4-8" />
    <path d="M22 14c0-4 4-4 4-8" />
  </g>
  <g
    font-family="Barlow Condensed, 'Arial Narrow', Arial, sans-serif"
    font-size="18"
    font-weight="600"
    fill="currentColor"
    letter-spacing="1.2"
  >
    <text x="50" y="24">KOPI KITA</text>
    <text x="50" y="44">KITA</text>
